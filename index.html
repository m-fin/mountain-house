<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#2a1c14" />
  <title>Hearthridge</title>
  <link rel="icon" href="data:,">
  <style>
    html, body {
      margin: 0; height: 100%; overflow: hidden; background: #1a1410;
      touch-action: none; overscroll-behavior: none;
      font-family: Georgia, "Times New Roman", serif;
    }
    canvas { display: block; touch-action: none; width: 100%; height: 100%; }
    #hud {
      position: fixed;
      left: max(14px, env(safe-area-inset-left));
      top: max(12px, env(safe-area-inset-top));
      color: #f3e6d0;
      font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      text-shadow: 0 1px 4px rgba(20, 12, 6, .85);
      max-width: min(70vw, 22rem);
      pointer-events: none;
      letter-spacing: .02em;
    }
    #hud b { font-weight: 700; color: #ffe6c2; }
    #titlecard {
      position: fixed; inset: 0; z-index: 30;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 40%, rgba(40,24,16,.35), rgba(12,8,6,.72) 70%);
      color: #f6ead6; text-align: center; cursor: pointer;
      transition: opacity .8s ease;
    }
    #titlecard.hide { opacity: 0; pointer-events: none; }
    #titlecard h1 {
      font-weight: 600; font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: .08em; margin: 0 0 .3rem;
      text-shadow: 0 2px 18px rgba(0,0,0,.6);
    }
    #titlecard p { margin: .15rem 0; font-size: 1.05rem; opacity: .88; font-style: italic; }
    #titlecard .go { margin-top: 1.4rem; font-style: normal; font-size: .92rem; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
    #hint, #toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      padding: 10px 16px; border-radius: 999px;
      background: rgba(32, 20, 12, .82);
      border: 1px solid #8a6a3a;
      color: #ffe6c2;
      font: 600 15px/1.2 system-ui, sans-serif;
      text-align: center; max-width: 90vw;
      pointer-events: none; z-index: 12;
      opacity: 0; transition: opacity .25s;
    }
    #hint { bottom: max(28px, calc(18px + env(safe-area-inset-bottom))); }
    #hint.show { opacity: 1; }
    #toast { top: max(18px, env(safe-area-inset-top)); z-index: 20; }
    #toast.show { opacity: 1; }
    #barwrap {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: max(68px, calc(58px + env(safe-area-inset-bottom)));
      width: min(240px, 60vw); height: 8px;
      background: rgba(20,12,8,.55); border: 1px solid #8a6a3a;
      border-radius: 99px; overflow: hidden; opacity: 0;
      pointer-events: none; z-index: 12; transition: opacity .2s;
    }
    #barwrap.show { opacity: 1; }
    #bar { height: 100%; width: 0; background: linear-gradient(90deg, #e07a5f, #f2d48b); }
    #helpbtn, #mutebtn {
      position: fixed; z-index: 15; width: 44px; height: 44px;
      border-radius: 12px; cursor: pointer;
      color: #f3e6d0; background: rgba(40, 26, 16, .78);
      border: 2px solid #8a6a3a;
      font: 700 18px system-ui, sans-serif;
    }
    #helpbtn { left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); }
    #mutebtn { left: max(68px, calc(16px + env(safe-area-inset-left) + 52px)); bottom: max(16px, env(safe-area-inset-bottom)); }
    #helppanel {
      display: none; position: fixed; z-index: 22;
      left: 50%; top: 50%; transform: translate(-50%,-50%);
      width: min(420px, calc(100vw - 32px));
      background: rgba(28, 18, 12, .94);
      color: #f3e6d0; border: 1px solid #8a6a3a; border-radius: 16px;
      padding: 18px 20px 16px; font: 15px/1.5 system-ui, sans-serif;
      box-shadow: 0 12px 40px rgba(0,0,0,.45);
    }
    #helppanel.show { display: block; }
    #helppanel h2 { font: 600 1.2rem Georgia, serif; margin: 0 0 .6rem; }
    #helppanel pre { margin: 0; font: 13.5px/1.55 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
    #helppanel .close { margin-top: 12px; font: 600 13px system-ui; color: #c4a574; }
    #touch { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 14; }
    body.touch #touch { display: block; }
    body.touch #helpbtn { left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); bottom: auto; }
    body.touch #mutebtn { left: max(64px, calc(12px + env(safe-area-inset-left) + 52px)); top: max(12px, env(safe-area-inset-top)); bottom: auto; }
    body.touch #hud { top: max(64px, calc(52px + env(safe-area-inset-top))); }
    body.touch #hint { bottom: calc(168px + env(safe-area-inset-bottom)); }
    body.touch #barwrap { bottom: calc(210px + env(safe-area-inset-bottom)); }
    body.touch #toast { top: max(64px, calc(52px + env(safe-area-inset-top))); }
    #stick {
      position: absolute;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(18px, env(safe-area-inset-bottom));
      width: 128px; height: 128px; border-radius: 50%;
      background: rgba(40, 26, 16, .45);
      border: 2px solid rgba(243, 230, 208, .45);
      pointer-events: auto; touch-action: none;
    }
    #knob {
      position: absolute; left: 44px; top: 44px; width: 40px; height: 40px;
      border-radius: 50%; background: rgba(243, 230, 208, .92);
      box-shadow: 0 0 12px rgba(224, 122, 95, .4);
    }
    #usebtn {
      position: absolute;
      right: max(22px, env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      width: 92px; height: 92px; border-radius: 50%;
      font: 700 16px system-ui, sans-serif; color: #f3e6d0;
      background: rgba(40, 26, 16, .72);
      border: 2px solid #8a6a3a;
      pointer-events: auto; touch-action: none;
    }
    #usebtn.held { background: rgba(224, 122, 95, .55); border-color: #f2d48b; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <div id="hint"></div>
  <div id="barwrap"><div id="bar"></div></div>
  <div id="toast"></div>
  <button id="helpbtn" type="button" title="Controls (?)">?</button>
  <button id="mutebtn" type="button" title="Mute sound">♪</button>
  <div id="helppanel"></div>
  <div id="touch">
    <div id="stick"><div id="knob"></div></div>
    <button id="usebtn" type="button">Use</button>
  </div>
  <div id="titlecard">
    <h1>Hearthridge</h1>
    <p>a cozy couple game</p>
    <p class="go">Tap to walk outside</p>
  </div>

  <script type="module">
    import {
      defaultState, applySave, loadSave, persist, clearSave, step,
      hudLines, taskPrompt, taskProgress, timePreset, TITLE, groundY,
    } from './game.mjs';
    import { createRenderer } from './render.mjs';
    import { createAudio } from './audio.mjs';

    const q = new URLSearchParams(location.search);
    const fresh = q.get('fresh') === '1';
    const viewSize = () => {
      const vv = window.visualViewport;
      return [Math.round(vv ? vv.width : innerWidth), Math.round(vv ? vv.height : innerHeight)];
    };
    const [vw, vh] = viewSize();
    const canvas = document.getElementById('c');
    const R = createRenderer(canvas, vw, vh, { pixelRatio: devicePixelRatio, preserveDrawingBuffer: q.get('shot') === '1' });

    const state = defaultState();
    if (!fresh) applySave(state, loadSave());
    else clearSave();
    const preset = timePreset(q.get('time'));
    if (preset != null) state.timeOfDay = preset;
    if (q.get('grown') === '1') {
      state.tasks.garden.planted = true;
      state.tasks.garden.watered = true;
      state.tasks.garden.growth = 1;
    }

    const hud = document.getElementById('hud');
    const hint = document.getElementById('hint');
    const toastEl = document.getElementById('toast');
    const barwrap = document.getElementById('barwrap');
    const bar = document.getElementById('bar');
    const titlecard = document.getElementById('titlecard');
    const helpBtn = document.getElementById('helpbtn');
    const muteBtn = document.getElementById('mutebtn');
    const helpPanel = document.getElementById('helppanel');
    const audio = createAudio();

    const HELP = `${TITLE} controls

Keyboard / mouse
  WASD — walk
  Mouse — look (click the view to capture the cursor)
  Arrows — turn
  E or Space — hold to work on a task
  M — mute sound
  ? — this panel

Phone
  Left stick — walk
  Drag the right side of the screen — look
  Hold Use — repair, plant, water, or light the hearth

Your person will wander the ridge with you, and will water the garden if you have already planted it.

Progress saves in this browser.`;

    helpPanel.innerHTML = `<h2>${TITLE}</h2><pre>${HELP}</pre><div class="close">Press ? or tap outside to close</div>`;

    const keys = new Set();
    const touch = { axis: [0, 0], use: false, lookId: null, lx: 0, ly: 0 };
    let lookX = 0, lookY = 0, mouseLook = 0;
    let started = q.get('nostart') === '1' || q.get('shot') === '1';
    if (started) titlecard.classList.add('hide');

    const touchOn = q.get('touch') === '1'
      || (typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches)
      || ((navigator.maxTouchPoints || 0) > 0 && Math.min(innerWidth, innerHeight) < 820);
    if (touchOn) document.body.classList.add('touch');

    function begin() {
      if (started) return;
      started = true;
      titlecard.classList.add('hide');
      audio.unlock();
    }
    titlecard.addEventListener('pointerdown', (e) => { e.preventDefault(); begin(); });
    addEventListener('keydown', () => begin(), { once: true });

    addEventListener('keydown', (e) => {
      if ((e.code === 'Slash' && e.shiftKey) || e.key === '?') { toggleHelp(); e.preventDefault(); return; }
      if (e.code === 'KeyM') { muteBtn.textContent = audio.toggle() ? '×' : '♪'; e.preventDefault(); return; }
      if (e.code === 'Escape') { helpPanel.classList.remove('show'); return; }
      if (['KeyW','KeyA','KeyS','KeyD','Space','KeyE','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.code)) {
        keys.add(e.code);
        e.preventDefault();
        begin();
        audio.unlock();
      }
    });
    addEventListener('keyup', (e) => keys.delete(e.code));
    addEventListener('blur', () => keys.clear());
    document.addEventListener('visibilitychange', () => { if (document.hidden) keys.clear(); });

    let touchLookUntil = 0;
    addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'touch') touchLookUntil = performance.now() + 800;
      audio.unlock();
    });
    addEventListener('mousemove', (e) => {
      if (!started || performance.now() < touchLookUntil) return;
      if (!e.movementX && !e.movementY) return;
      if (document.pointerLockElement || e.buttons === 1) {
        lookX -= e.movementX * 0.0032;
        lookY -= e.movementY * 0.0024;
      }
    });
    canvas.addEventListener('click', () => {
      if (!started || performance.now() < touchLookUntil) return;
      if (document.body.classList.contains('touch')) return;
      canvas.requestPointerLock?.();
    });

    const stick = document.getElementById('stick'), knob = document.getElementById('knob');
    const useBtn = document.getElementById('usebtn');
    function setKnob(x, y) { knob.style.transform = `translate(${x * 40}px, ${y * 40}px)`; }
    stick.addEventListener('pointerdown', (e) => {
      stick.setPointerCapture(e.pointerId);
      stick.dataset.pid = String(e.pointerId);
      placeStick(e); e.preventDefault(); begin(); audio.unlock();
    });
    stick.addEventListener('pointermove', (e) => {
      if (stick.dataset.pid !== String(e.pointerId)) return;
      placeStick(e);
    });
    function endStick(e) {
      if (stick.dataset.pid !== String(e.pointerId)) return;
      stick.dataset.pid = '';
      touch.axis = [0, 0];
      setKnob(0, 0);
    }
    stick.addEventListener('pointerup', endStick);
    stick.addEventListener('pointercancel', endStick);
    function placeStick(e) {
      const r = stick.getBoundingClientRect();
      let x = (e.clientX - (r.left + r.width / 2)) / 46;
      let y = (e.clientY - (r.top + r.height / 2)) / 46;
      const m = Math.hypot(x, y);
      if (m > 1) { x /= m; y /= m; }
      touch.axis = [x, -y];
      setKnob(x, y);
    }
    function holdUse(on) {
      touch.use = on;
      useBtn.classList.toggle('held', on);
    }
    useBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault(); e.stopPropagation();
      useBtn.setPointerCapture?.(e.pointerId);
      holdUse(true); begin(); audio.unlock();
    });
    useBtn.addEventListener('pointerup', () => holdUse(false));
    useBtn.addEventListener('pointercancel', () => holdUse(false));

    canvas.addEventListener('pointerdown', (e) => {
      if (!document.body.classList.contains('touch') || e.pointerType === 'mouse') return;
      if (e.target !== canvas) return;
      touch.lookId = e.pointerId; touch.lx = e.clientX; touch.ly = e.clientY;
      begin(); audio.unlock();
    });
    canvas.addEventListener('pointermove', (e) => {
      if (e.pointerId !== touch.lookId) return;
      lookX -= (e.clientX - touch.lx) * 0.005;
      lookY -= (e.clientY - touch.ly) * 0.004;
      touch.lx = e.clientX; touch.ly = e.clientY;
    });
    canvas.addEventListener('pointerup', (e) => { if (e.pointerId === touch.lookId) touch.lookId = null; });
    canvas.addEventListener('pointercancel', (e) => { if (e.pointerId === touch.lookId) touch.lookId = null; });

    helpBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleHelp(); });
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      audio.unlock();
      const m = audio.toggle();
      muteBtn.textContent = m ? '×' : '♪';
    });
    helpPanel.addEventListener('click', (e) => e.stopPropagation());
    addEventListener('pointerdown', (e) => {
      if (helpPanel.classList.contains('show') && e.target !== helpBtn && !helpPanel.contains(e.target)) {
        helpPanel.classList.remove('show');
      }
    });
    function toggleHelp() { helpPanel.classList.toggle('show'); }

    function gatherInput() {
      const k = (c) => (keys.has(c) ? 1 : 0);
      let mx = k('KeyD') - k('KeyA') + touch.axis[0];
      let mz = k('KeyW') - k('KeyS') + touch.axis[1];
      const turn = (k('ArrowRight') - k('ArrowLeft')) * 0.035;
      const pit = (k('ArrowUp') - k('ArrowDown')) * 0.02;
      const use = keys.has('KeyE') || keys.has('Space') || touch.use;
      const inp = { mx, mz, lookX: lookX + turn, lookY: lookY + pit, use };
      lookX = 0; lookY = 0;
      return inp;
    }

    function showHud() {
      const lines = hudLines(state);
      const tod = state.timeOfDay;
      const clock = clockLabel(tod);
      hud.innerHTML = `<b>${TITLE}</b>  ·  ${clock}<br>${lines.join('<br>')}`;
      const prompt = taskPrompt(state);
      hint.textContent = prompt;
      hint.classList.toggle('show', !!prompt);
      const p = taskProgress(state);
      barwrap.classList.toggle('show', !!state.near && p > 0.02);
      bar.style.width = `${Math.round(p * 100)}%`;
      toastEl.textContent = state.toast || '';
      toastEl.classList.toggle('show', !!state.toast);
    }

    function clockLabel(tod) {
      const minutes = Math.floor(tod * 24 * 60);
      const h24 = Math.floor(minutes / 60) % 24;
      const m = minutes % 60;
      const h = ((h24 + 11) % 12) + 1;
      const am = h24 < 12 ? 'AM' : 'PM';
      const mm = m < 10 ? '0' + m : '' + m;
      let sky = 'night';
      if (tod > 0.22 && tod < 0.32) sky = 'dawn';
      else if (tod >= 0.32 && tod < 0.68) sky = 'day';
      else if (tod >= 0.68 && tod < 0.82) sky = 'sunset';
      else if (tod >= 0.82 && tod < 0.9) sky = 'dusk';
      return `${h}:${mm} ${am}  ${sky}`;
    }

    function resize() {
      const [w, h] = viewSize();
      R.resize(w, h);
    }
    addEventListener('resize', resize);
    visualViewport?.addEventListener('resize', resize);

    let last = performance.now();
    let frames = 0;
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      if (started) {
        const inp = gatherInput();
        if (q.get('freeze') === '1') inp.freezeTime = true;
        step(state, inp, dt);
      } else {
        // Title card: still drift the camera a little by stepping with no input and frozen time? Keep scene alive.
        step(state, { mx: 0, mz: 0, lookX: 0, lookY: 0, use: false, freezeTime: true }, dt);
      }
      R.update(state, dt);
      R.render();
      showHud();
      frames++;
      if (frames === 1) {
        canvas.dataset.ready = '1';
        document.documentElement.dataset.ready = '1';
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);

    // Test / screenshot hook. Not a cheat menu — used by the playtest and by ?shot=1.
    window.MH = {
      get state() { return state; },
      get renderer() { return R; },
      TITLE,
      begin,
      persist: () => persist(state),
      clearSave,
      setTime(t) { state.timeOfDay = ((t % 1) + 1) % 1; },
      setGrowth(v) { state.tasks.garden.growth = Math.max(0, Math.min(1, v)); },
      place(x, z, yaw) {
        state.player.x = x; state.player.z = z;
        if (yaw != null) { state.player.yaw = yaw; state.cam.yaw = yaw; }
      },
      look(yaw, pitch) {
        if (yaw != null) state.cam.yaw = yaw;
        if (pitch != null) state.cam.pitch = pitch;
      },
      snapCamera() { R.update(state, 0); R.snapCamera(state); R.render(); },
      holdUse(seconds = 1.4) {
        const steps = Math.ceil(seconds / 0.05);
        for (let i = 0; i < steps; i++) step(state, { mx: 0, mz: 0, lookX: 0, lookY: 0, use: true, freezeTime: true }, 0.05);
      },
      tick(n = 1, inp = {}) {
        for (let i = 0; i < n; i++) step(state, { mx: 0, mz: 0, lookX: 0, lookY: 0, use: false, freezeTime: true, ...inp }, 1 / 30);
        R.update(state, n / 30);
        R.render();
        showHud();
        return state;
      },
      groundY,
    };
  </script>
</body>
</html>
